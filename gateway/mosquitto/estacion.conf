# /etc/mosquitto/conf.d/estacion.conf
# Broker local del Gateway · Challenge #3

# Escucha en toda la WLAN (el ESP32 se conecta desde otra máquina)
listener 1883 0.0.0.0

# Acceso restringido: nadie publica ni lee sin usuario y clave
allow_anonymous false
password_file /etc/mosquitto/estacion.passwd

# Mínimo privilegio: cada usuario solo toca sus tópicos
acl_file /etc/mosquitto/estacion.acl

# Los mensajes retenidos (estado, última alerta) sobreviven a un reinicio
persistence true
persistence_location /var/lib/mosquitto/

# Tope al keepalive que puede pedir un cliente: acota cuánto tarda el
# broker en notar que un nodo desapareció (1,5 x keepalive)
max_keepalive 120
